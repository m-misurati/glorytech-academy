    <script>
      // Apply saved theme and language before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('glory-theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var lang = localStorage.getItem('glory-lang');
        if (lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (error) {}
    </script>
