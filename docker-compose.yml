# Local run of the production image: docker compose up --build
# Open http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Injected into index.html at runtime; all public values.
      SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in .env}
      # Cloudflare Worker that serves lesson video.
      API_BASE: ${VITE_API_BASE:-}
      CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-info@glorytech.ly}
      TELEGRAM_CHANNEL: ${VITE_TELEGRAM_CHANNEL:-}
    restart: unless-stopped
